{% extends 'base.html' %}{% block title %}Create Draft Alert | FloodGuard Sentinel{% endblock %}{% block content %}<div class="form-card"><span class="eyebrow">RISK & ALERT OFFICER</span><h1>Create draft alert</h1><div class="alert alert-warning">This form only creates a draft record. It does not send messages or issue an official emergency warning.</div><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="mb-3"><label class="form-label">Location</label><select class="form-select" name="location_id" required>{% for l in locations %}<option value="{{ l.id }}">{{ l.name }} — {{ l.district }}</option>{% endfor %}</select></div><div class="mb-3"><label class="form-label">Title</label><input class="form-control" name="title" required></div><div class="mb-3"><label class="form-label">Severity</label><select class="form-select" name="severity"><option>Informational</option><option>Watch</option><option>High concern</option><option>Critical</option></select></div><div class="mb-3"><label class="form-label">Message</label><textarea class="form-control" name="message" rows="4" minlength="15" required></textarea></div><button class="btn btn-primary">Save as draft</button> <a class="btn btn-outline-secondary" href="{{ url_for('main.alerts') }}">Cancel</a></form></div>{% endblock %}
