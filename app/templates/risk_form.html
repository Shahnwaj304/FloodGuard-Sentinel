{% extends 'base.html' %}{% block title %}New Risk Assessment | FloodGuard Sentinel{% endblock %}{% block content %}<div class="form-card"><span class="eyebrow">RISK & ALERT OFFICER</span><h1>Record assessment</h1><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="mb-3"><label class="form-label">Location</label><select class="form-select" name="location_id" required>{% for l in locations %}<option value="{{ l.id }}">{{ l.name }} — {{ l.district }}</option>{% endfor %}</select></div><div class="mb-3"><label class="form-label">Assessment level</label><select class="form-select" name="level" required>{% for level in levels %}<option>{{ level }}</option>{% endfor %}</select></div><div class="mb-3"><label class="form-label">Evidence-based rationale and limitations</label><textarea class="form-control" name="rationale" rows="5" required minlength="15" placeholder="Explain evidence considered, source dates, uncertainty, and why this label was selected."></textarea></div><button class="btn btn-primary">Save assessment</button> <a class="btn btn-outline-secondary" href="{{ url_for('main.risk') }}">Cancel</a></form></div>{% endblock %}
