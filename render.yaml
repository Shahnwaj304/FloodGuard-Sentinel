services:
  - type: web
    name: floodguard-sentinel
    env: python
    repo: https://github.com/Shahnwaj304/FloodGuard-Sentinel
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn run:app --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 120
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        sync: false
      - key: INITIAL_STAFF_PASSWORD
        sync: false
      - key: DEMO_MODE
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: floodguard-db
          property: connectionString
  - type: pserv
    name: floodguard-db
    env: postgres
    region: singapore
    plan: free
    ipAllowList: []
